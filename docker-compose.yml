  - compose/dockhand.yml
  - compose/dozzle.yml
  - compose/homepage.yml
  # - compose/homarr.yml
  # MEDIA
  - compose/jellyfin.yml
  - compose/remux.yml
  # - compose/torbox-media-center.yml
  - compose/strmbridge.yml
  - compose/stremthru.yml
  # DOWNLOADERS
  # - compose/sabnzbd.yml
  # - compose/deluge.yml
  - compose/qbittorrent.yml
  - compose/decypharr.yml
  # PVRS
  - compose/radarr.yml
  - compose/sonarr.yml
  - compose/prowlarr.yml
  # COMPLEMENTARY APPS
