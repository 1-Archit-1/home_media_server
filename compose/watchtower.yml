services:
  # Watchtower - Automatic Docker container updates
  # Checks for new images daily at 4am and recreates containers with updated images
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - socket_proxy
    environment:
      TZ: $TZ
      DOCKER_HOST: tcp://socket-proxy:2375
      WATCHTOWER_CLEANUP: true           # remove old images after update
      WATCHTOWER_SCHEDULE: "0 0 4 * * *" # run daily at 4am
      WATCHTOWER_INCLUDE_STOPPED: false  # only update running containers
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
