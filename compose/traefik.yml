services:
  # Traefik v3 - Reverse Proxy with automatic DuckDNS Let's Encrypt HTTPS
  # Only services with `traefik.enable=true` (Jellyfin & Remux) are exposed.
  # Required in ~/docker/.env (run: python3 update-env.py --prompt DOMAINNAME DUCKDNS_TOKEN ACME_EMAIL):
  #   DOMAINNAME=yoursubdomain.duckdns.org
  #   DUCKDNS_TOKEN=your-duckdns-token
  #   ACME_EMAIL=you@example.com
  traefik:
    image: traefik:v3
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - default
      - socket_proxy
    ports:
      - "80:80"
      - "443:443"
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=duckdns
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAINNAME}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAINNAME}
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --certificatesresolvers.duckdns.acme.dnschallenge=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns
      - --certificatesresolvers.duckdns.acme.dnschallenge.delaybeforecheck=30
      - --certificatesresolvers.duckdns.acme.dnschallenge.propagation.disablechecks=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.duckdns.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.duckdns.acme.storage=/letsencrypt/acme.json
    volumes:
      - $DOCKERDIR/appdata/traefik/letsencrypt:/letsencrypt
    environment:
      TZ: $TZ
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
